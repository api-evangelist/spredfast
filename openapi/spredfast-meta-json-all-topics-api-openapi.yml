openapi: 3.2.0
info:
  title: stream-api Meta.json?all Topics API
  version: '1.1'
servers:
- url: https://api.massrelevance.com
security:
- sec0: []
tags:
- name: Meta.json?all Topics
paths:
  /{account}/{streamName}/meta.json?all_topics:
    get:
      summary: Get all topics
      description: Returns all topics, not just those with count > 0
      operationId: get-all-topics
      parameters:
      - name: account
        in: path
        schema:
          type: string
        required: true
      - name: streamName
        in: path
        schema:
          type: string
        required: true
      - name: all_topics
        in: query
        schema:
          type: integer
          format: int32
          default: 3
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: Coming Soon
      deprecated: false
      security: []
      tags:
      - Meta.json?all Topics
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth2/token
          scopes: {}
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: true
x-readme-fauxas: true
