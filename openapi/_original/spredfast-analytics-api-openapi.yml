openapi: 3.1.0
info:
  title: beta-analytics-api
  version: '1.1'
servers:
- url: https://api.spredfast.com/v2/analytics
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth2/token
          scopes: {}
security:
- sec0: []
paths:
  /export/posts:
    post:
      summary: Published Posts
      description: Export Posts and Metrics for those Posts
      operationId: published-post
      parameters:
      - name: header
        in: query
        description: If `true` then include CSV headers.
        schema:
          type: boolean
          default: true
      - name: delimiter
        in: query
        description: Allows you to specify a custom delimiter for CSV exports.
        schema:
          type: string
          default: ','
      - name: email_recipients
        in: query
        description: '(Optional) When an Export completes, a notification-email will be sent to each email-recipient
          on this list.  Each email-address must also have an associated Spredfast account to access the
          file.  Submitting no email addresses will result in no email notifications being sent.  Example:
          “BobSmith@Spredfast.com,CarolJane@Spredfast.com”'
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  description: A set of attributes for filtering the export.
                  required:
                  - fields
                  properties:
                    accounts:
                      type: array
                      description: The uniqueIds of Accounts used to query for results. Account uniqueIds
                        can be obtained via the AccountSet API and are the preferred method for specifying
                        accounts within the Analytics API. Submitting no accounts will result in querying
                        based on all accounts the user has permission to access.
                      items:
                        type: string
                    content_filter:
                      type: object
                      properties:
                        dark:
                          type: boolean
                          description: '`true`: Returns only dark posts. `false`: Returns only non-dark
                            posts. If not present, all posts are returned.'
                        promoted:
                          type: boolean
                          description: '`true`: Returns only promoted posts. `false`: Returns only non-promoted
                            posts. Excluding the attribute returns all posts.'
                        tags:
                          type: object
                          properties:
                            untagged:
                              type: boolean
                              description: Return only posts with no labels.
                            tags:
                              type: array
                              description: Returns posts which contain labels matching the label-ids included
                                here.  Label-Ids can be found in API Explorer using the `LabelSets` API,
                                within the `legacyId` field. The `id` field containing a UUID will not
                                work.
                              items:
                                type: integer
                                format: int32
                        post_type:
                          type: string
                          description: '`post`: Only brand posts. `response`: Only brand comments/responses.
                            `all`: All content'
                          enum:
                          - '"post"'
                          - '"response"'
                          - '"all"'
                        plans:
                          type: array
                          description: ids of `Plan`s to filter for
                          items:
                            type: string
                        content_types:
                          type: array
                          description: 'Represents the type of the post. Supported values: `text`, `blog`,
                            `comment`, `discussion-topic`, `photo`, `photo-album`, `presentation`, `video`,
                            `link`, `service-event`, `microblog`, `story`, `carousel`, `multi-photo`,
                            `igtv`, `multi-video`, `mixed-assets`, `reels`'
                          items:
                            type: string
                    intiatives:
                      type: array
                      description: ids of initiatives to filter for
                      items:
                        type: integer
                        format: int64
                    account_sets:
                      type: array
                      description: ids of account sets to filter for
                      items:
                        type: integer
                        format: int64
                    fields:
                      type: array
                      description: ids of the [fields to export](/khorosmarketingdevdocs/reference/get-available-report-fields)
                      items:
                        type: integer
                        format: int64
                    start:
                      type: string
                      description: Start date in ISO-8601 format (e.g. 2017-03-01). The start date is
                        inclusive (i.e. included in the response). **Format:** date
                    stop:
                      type: string
                      description: Stop date in ISO-8601 format (e.g. 2017-03-01 ). Stop date day’s results
                        are excluded. **Format:** date
                    timezone:
                      type: string
                      description: Timezone descriptor to apply for date formatting and define how to
                        interpret the start and stop dates for some exports. Example `America/Los_Angeles`
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"export_id\": \"1234567\"\n}"
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    example: '1234567'
      deprecated: false
      security: []
  /export/accounts:
    post:
      summary: Daily Account Level Metrics
      description: Export contains daily account-level performance metrics
