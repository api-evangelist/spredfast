        schema:
          type: string
          default: ','
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  properties: {}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"export_id\": \"1234567\"\n}"
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    example: '1234567'
      deprecated: false
      security: []
