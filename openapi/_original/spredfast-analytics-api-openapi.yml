                      items:
                        type: integer
                        format: int32
                    timezone:
                      type: string
                      description: Timezone to format dates in. Also to use for defining the start of
                        day if start/stop values don't include time. Example `America/Los_Angeles`
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"export_id\": \"1958302\"\n}"
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    example: '1958302'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
