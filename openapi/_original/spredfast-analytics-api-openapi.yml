  /export/stream_items:
    post:
      summary: Stream Item Data
      description: Generates an export file containing stream items within the requested date and stream
        parameters using Khoros Marketing Analytics API.
      operationId: stream-item-data
      parameters:
      - name: format
        in: query
        description: Supports `json` and `csv`.
        schema:
          type: string
          default: csv
      - name: header
        in: query
        description: If `true` then include CSV column headers.
        schema:
          type: boolean
          default: true
      - name: delimiter
        in: query
        description: Allows you to specify a custom delimiter for CSV exports. **maxLength:** `1` **minLength:**
          `1`
        schema:
          type: string
          default: ','
      - name: email_recipients
        in: query
        description: '(Optional) When an Export completes, a notification-email will be sent to each email-recipient
          on this list.  Each email-address must also have an associated Spredfast account to access the
          file.  Submitting no email addresses will result in no email notifications being sent.  Example:
          “BobSmith@Spredfast.com,CarolJane@Spredfast.com”'
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  required:
                  - start
                  - stop
                  - fields
                  properties:
                    start:
                      type: string
                      description: Start date in ISO-8601 format (e.g. 2017-03-01 or 2017-03-01T16:00:00Z).
                        The start date is inclusive (i.e. included in the response)
                    stop:
                      type: string
                      description: Stop date in ISO-8601 format (e.g. 2017-03-01 or 2017-03-01T16:00:00Z).
                        If no time is provided, the stop time defaults to the beginning of the day and
                        the day’s results are excluded.
                    only_responded_items:
                      type: boolean
                      description: Include actions only for items that have been responded to at least
                        once
                      default: false
                    fields:
                      type: array
                      description: Select the columns to be returned with your export.  Columns will be
                        returned in the same order as requested.  See ‘/v2/analytics/export/{export_type}/fields’
                        for information on available fields and their ids.
                      items:
                        type: integer
                        format: int32
                    stream_ids:
                      type: array
                      description: IDs of the source streams to be included; defaults to all streams
                      items:
                        type: integer
                        format: int32
                    topic_ids:
                      type: string
                      description: IDs of the source topics to be included. Defaults to all
                    timezone:
                      type: string
                      description: Timezone to format dates in. Also to use for defining the start of
                        day if start/stop values don't include time. Example `America/Los_Angeles`
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"export_id\": \"1958302\"\n}"
              schema:
                type: object
                properties:
                  export_id:
                    type: string
                    example: '1958302'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
