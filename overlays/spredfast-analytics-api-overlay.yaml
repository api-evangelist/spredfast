- target: $
  description: Record the cross-cutting runtime semantics the contract does not declare.
  update:
    x-idempotency:
      supported: false
      note: No idempotency key of any kind; retrying a publish POST publishes twice.
    x-rate-limits:
      published: false
      headers: []
      note: No published limit and no rate-limit response header on any operation.
    x-error-format:
      rfc9457: false
      envelope: '{ "status": { "error": { "code", "message" }, "succeeded": false } }'
