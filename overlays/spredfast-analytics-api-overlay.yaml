- target: $.components.securitySchemes['sec0']
  description: The source declares a clientCredentials flow with tokenUrl https://example.com/oauth2/token
    — a documentation-tool placeholder, not a Spredfast endpoint. Replace it with the real authorization-code
    flow the Conversations V1 contract and the getting-started guide both publish.
  update:
    type: oauth2
    description: 3-legged OAuth 2.0. Client id and secret are issued by Khoros support; the DevCenter
      application must be enabled for the company. Access tokens are valid for 24 months.
    flows:
      authorizationCode:
        authorizationUrl: https://login.spredfast.com/v3/oauth/authorize
        tokenUrl: https://login.spredfast.com/v3/oauth/token
        scopes:
          all: Read/write access for all endpoints.
