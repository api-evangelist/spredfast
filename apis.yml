- name: Spredfast Experiences Stream API
  description: >-
    Curated social stream data powering Khoros Marketing Experiences
    visualisations — 48 operations for stream items, leaderboards, stream meta,
    topic and hashtag counts, and volume comparison. Served from
    api.massrelevance.com, the host inherited from Mass Relevance, which
    Spredfast acquired in 2013 and rebranded as Spredfast Experiences; the
    provider's own reference page states "Experiences is a Khoros Marketing
    product" and that access requires accepting the Spredfast Experiences API
    usage agreement. PROBED 2026-08-13: that host returns HTTP 502 on every path
    including /, while the contract remains published on the current developer
    center.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/reference/stream-api
