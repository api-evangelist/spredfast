- name: Spredfast Notifications (Events) API
  description: >-
    The event surface — six operations managing event subscriptions. A
    subscription binds one eventName; setting notificationUri makes delivery a
    push (with an optional subscriber-supplied bearerToken), omitting it makes
    it a poll against GET /data/{subscriptionId}. Eleven event types are
    documented, including four credential-* events that report social account
    de-authorization. No AsyncAPI document is published.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/docs/notification-tutorials
  baseURL: https://api.spredfast.com/v2/events
