- name: Spredfast Custom CRM Callback Contract
  description: >-
    An INVERTED contract — 13 operations the CUSTOMER implements on their own
    domain and Khoros Marketing calls. Cases, customers, best-match lookup, a
    customer's cases, list and asset resources, and GET /meta/object/{type},
    which lets the customer describe their own object structures back to Khoros.
    The templated server https://{your-domain}.com is correct and deliberate,
    not a defect: the host is the customer's. Failures on this integration are
    reported asynchronously through the error-custom-crm event.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/reference/api-specification-introduction
  baseURL: https://{your-domain}.com
  tags:
  - CRM
