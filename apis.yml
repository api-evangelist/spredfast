aid: spredfast
name: Spredfast
description: >-
  Spredfast was an Austin-based social media marketing and management platform
  providing social publishing, engagement, listening, and analytics for
  enterprise brands and agencies. Backed by Battery Ventures, Spredfast merged
  with Lithium Technologies in 2018; the combined company rebranded as Khoros in
  2019, and the Spredfast product line is now delivered as Khoros Marketing. Its
  developer API surface — the Conversations API, Publishing API, Analytics
  Reporting API, Notification API, and CRM API — is documented today under the
  Khoros developer center at developer.khoros.com, secured with OAuth 2.0. The
  legacy api.spredfast.com host still resolves, while the original
  devcenter.spredfast.com developer portal is no longer maintained.
