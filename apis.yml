- name: Spredfast Analytics Reporting API
  description: >-
    Asynchronous analytics exports — 12 operations. Eight export endpoints
    (published posts, daily account metrics, daily post summary, ads net values,
    stream items, stream item actions, customer feedback, profiles) start a job
    that is then polled at GET /export/{id}/status; field discovery and stream
    listing are synchronous. Documented as beta.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/docs/calling-the-analytics-reporting-api
