aid: spredfast
name: Spredfast
description: >-
  Spredfast was an Austin-based social media marketing and management platform
  providing social publishing, engagement, listening, and analytics for
  enterprise brands and agencies. Backed by Battery Ventures, it acquired Mass
  Relevance in 2013, merged with Lithium Technologies in 2018, and the combined
  company rebranded as Khoros in 2019; the Spredfast product line is delivered
  today as Khoros Marketing and documented at developer.khoros.com. The API
  surface still carries the Spredfast name in production — the host is
  api.spredfast.com, OAuth 2.0 runs on login.spredfast.com, request headers use
  the x-sf- vendor prefix, and the Conversations v1 contract is still licensed
  as "Spredfast API Terms of Use". Nine OpenAPI documents covering 149
  operations are published through the Khoros developer center: Conversations
  v2 and v1, an asynchronous Analytics Reporting API, a Notifications (Events)
  API with eleven documented event types, CRM registration, Label Sets, token
  introspection, the Experiences Stream API inherited from Mass Relevance, and
  an inverted Custom CRM contract the customer implements. The original
  devcenter.spredfast.com developer portal is dead and spredfast.com returns
  503.
