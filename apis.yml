- name: Spredfast CRM Registration API
  description: >-
    Two operations to register and update a customer-implemented Custom CRM so
    Khoros Marketing can call it — POST /admin/custom and PATCH
    /admin/custom/{crmId}. The paired contract the customer must implement is
    the Custom CRM Callback Contract.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/reference/custom-crm-registration
