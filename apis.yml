- name: Spredfast Conversations API (v1)
  description: >-
    The original Spredfast Conversations API, still live alongside v2 on
    api.spredfast.com — 27 operations for publishing, assets, folders,
    initiatives, plans and privileges. Paths take the form
    /{environment}/v1/company/{companyId}/... where the environment segment is a
    case-sensitive deployment name (Production, VPC1, APP3). This is the one
    contract that declares the real OAuth endpoints on login.spredfast.com and
    carries the "Spredfast API Terms of Use" licence. No deprecation or sunset
    notice is published for it.
  humanURL: https://developer.khoros.com/khorosmarketingdevdocs/reference
