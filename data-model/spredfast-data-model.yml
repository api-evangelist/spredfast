note: >-
  Derived from the harvested contracts: entity names come from the `sfEntityType`
  discriminator that Spredfast stamps on every object it returns, and
  relationships from id-reference fields and path nesting. The specs carry no
  reusable `components.schemas` — every payload is inlined per operation — so
  there are no $ref links to walk; the graph below is reconstructed from the
  discriminator and the id fields instead, and confidence is recorded per edge.
  There is no documented id-prefix scheme: identifiers are opaque numeric
  strings for platform objects and UUIDs for event subscriptions.
discriminator:
