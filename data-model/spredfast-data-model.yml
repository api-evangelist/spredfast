external_model:
  note: >-
    The Custom CRM contract (openapi/spredfast-custom-crm-callback-api-openapi.yml)
    describes an INVERTED model: Khoros Marketing is the client and the customer
    implements the server, so Case and Customer are entities the CUSTOMER owns
    and Spredfast reads. The contract additionally exposes
    GET /meta/object/{type}, letting the customer describe their own object
    structures back to Khoros — a self-describing schema hook, and the only
    schema-discovery mechanism anywhere in this API family.
  entities:
  - name: Case
    operations:
    - createcase
    - retrieve and patch by id
  - name: Customer
    operations:
    - createcustomer
    - bestmatchcustomers
    - retrieve and patch by id
    - list a customer's cases
  - name: ObjectMeta
    operations:
    - define-object-structures
gaps:
- >-
  No reusable components.schemas anywhere in the nine specs. Every request and
  response body is inlined at the operation, so nothing is $ref-shareable and no
  schema can be validated by name.
- >-
  Many response bodies are documented ONLY as a JSON example string inside
  `content.application/json.examples.Result.value` with no accompanying
  `schema`, so a machine can read the shape by example but cannot validate it.
- No id-prefix convention, so an identifier alone does not reveal its entity type.
