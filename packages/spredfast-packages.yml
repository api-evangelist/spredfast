note: >-
  Spredfast published NO first-party API client SDK. The Khoros Marketing
  (Spredfast) developer center documents raw HTTP + OAuth 2.0 only and links no
  client libraries. Four packages ARE published on npm under the `spredfast`
  maintainer account, but none of them wrap the Conversations, Publishing,
  Analytics, Notification or CRM APIs — they are internal build/UI/test
  utilities. Every one last shipped between 2016 and 2018, before the 2018
  Lithium merger and the 2019 Khoros rebrand, and none has been republished
  since. That is the abandonment signal: the company's own npm account went
  silent eight years before the APIs it never wrapped. Because no entry is an
  API client, NO `type: SDKs` pointer is emitted for this provider — emitting
  one would credit Spredfast with an SDK surface it does not have.
  Searched and NOT found: PyPI (`spredfast` 404), RubyGems (`spredfast` 404),
  Maven Central, NuGet, pkg.go.dev, Packagist, crates.io. The `khoros` package
  on PyPI (5.4.0, 2023-11-01) is a THIRD-PARTY community library by Jeff
  Shurtliff for Khoros Communities (the Lithium side of the merger), not for the
  Spredfast/Khoros Marketing API family, and is therefore excluded.
  github.com/spredfast is live (HTTP 200) with 30 public repositories, all of
  them forks of third-party open source (DataTables, modernizr, kafka, zipkin,
  woodstox, spark-cassandra-connector) — no first-party SDK repo.
